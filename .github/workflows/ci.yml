name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install devDeps only (typescript + @types/node); skip postinstall so the
      # build step below is the single, explicit compile.
      - name: Install dependencies
        run: npm install --ignore-scripts

      # `tsc` type-checks and emits dist/. Type errors fail the job.
      - name: Build (type-check + compile)
        run: npm run build

      - name: Test
        run: npm test
