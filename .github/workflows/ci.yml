name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install devDeps only (typescript + @types/node); skip postinstall so the
      # build step below is the single, explicit compile.
      - name: Install dependencies
        run: npm install --ignore-scripts

      # `tsc` type-checks and emits dist/. Type errors fail the job.
      - name: Build (type-check + compile)
        run: npm run build

      # dist/ is committed AND imported by the runtime daemon (src/index.js runs
      # against the COMMITTED dist). A fresh build must match what's checked in, or
      # users run stale code while CI tests a different copy. Fail on drift.
      - name: Verify committed dist is up to date
        run: git diff --exit-code dist/ || (echo "::error::dist/ is stale — run 'npm run build' and commit" && exit 1)

      # src/index.js, src/agents.js and everything under bin/ are plain JS/bash, excluded
      # from tsc and from `npm test` — a syntax / early-reference error in them would
      # otherwise ship green and only fail on the user's box, at `node src/index.js` or
      # `wrc start`. node --check / bash -n parse without running.
      - name: Syntax-check plain-JS entrypoints and the ops scripts
        run: |
          node --check src/index.js
          node --check src/agents.js
          node --check bin/hooks.mjs
          node --check bin/login.mjs
          bash -n bin/wrc

      # bin/wrc is documented as `bash bin/wrc …` but is also meant to be executable
      # directly; a lost mode bit turns the PATH wrapper into a confusing failure.
      - name: Verify bin/wrc is committed executable
        run: git ls-files -s bin/wrc | grep -q '^100755 ' || (echo "::error::bin/wrc must be mode 100755 — run 'chmod +x bin/wrc'" && exit 1)

      - name: Test
        run: npm test
